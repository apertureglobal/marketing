<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperture — Deck</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #1c1a17;
    --muted: #6b6560;
    --line: #e2dcd4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f;
      --fg: #f2ede7;
      --muted: #9a938b;
      --line: #2e2a25;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f;
    --fg: #f2ede7;
    --muted: #9a938b;
    --line: #2e2a25;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 16px 80px;
  }
  header { margin-bottom: 32px; }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .sub { color: var(--muted); margin: 0; }
  figure { margin: 0; }
  img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  figcaption {
    color: var(--muted);
    font-size: 14px;
    margin-top: 12px;
  }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  a { color: inherit; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Deck</h1>
      <p class="sub">Big Sky, Montana</p>
    </header>

    <figure>
      <img src="deck2.png" alt="Covered wood deck with dining table and chairs overlooking pine forest and mountains at sunset">
      <figcaption>Covered deck at sunset, looking out over the Gallatin Range.</figcaption>
    </figure>

    <footer>
      Published with GitHub Pages.
    </footer>
  </div>
</body>
</html>
