<script>
(function () {
  var band  = document.getElementById('band'),
      track = document.getElementById('track'),
      vid   = band.querySelector('video'),
      imgs  = track.getElementsByTagName('img'),
      dots  = document.getElementById('dots').getElementsByTagName('i'),
      swipe = document.getElementById('swipe'),
      navs  = [document.getElementById('prev'), document.getElementById('next')],
      w = 1024, n = imgs.length, i = 0, manual = false, timer,
      VIDEO_UNIT = true,   // what the unit is
      isVideo = VIDEO_UNIT;       // what it is showing right now

  // Video units carry the carousel underneath. If autoplay is refused the unit
  // falls back to the interactive carousel rather than a frozen frame.
  function showCarousel() {
    isVideo = false;
    if (vid) vid.style.display = 'none';
    navs.forEach(function (b) { b.style.display = 'flex'; });
    document.getElementById('dots').style.display = 'block';
    restart();
  }
  function hideCarouselChrome() {
    navs.forEach(function (b) { b.style.display = 'none'; });
    document.getElementById('dots').style.display = 'none';
    if (swipe) swipe.style.display = 'none';
  }

  function place() {
    var total = n * 7 + (n - 1) * 6, x = (w - total) / 2;
    for (var d = 0; d < dots.length; d++) { dots[d].style.left = x + 'px'; x += 13; }
  }
  function go(k, byHand) {
    i = (k + n) % n;
    track.style.transform = 'translateX(' + (-i * w) + 'px)';
    for (var d = 0; d < dots.length; d++) dots[d].className = (d === i ? 'on' : '');
    if (byHand) { manual = true; if (swipe) swipe.style.display = 'none'; restart(); }
  }
  function restart() { clearInterval(timer); timer = setInterval(function () { go(i + 1); }, 7500 / n); }

  place();
  document.getElementById('prev').onclick = function (e) { e.stopPropagation(); go(i - 1, true); };
  document.getElementById('next').onclick = function (e) { e.stopPropagation(); go(i + 1, true); };
  for (var d = 0; d < dots.length; d++) (function (k) {
    dots[k].onclick = function (e) { e.stopPropagation(); go(k, true); };
  })(d);

  var x0 = null;
  track.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  track.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 30) go(i + (dx < 0 ? 1 : -1), true);
    x0 = null;
  }, { passive: true });

  // The walkthrough runs the full 15000 ms once; when it ends the carousel
  // takes the space rather than leaving a frozen last frame. Belt and braces:
  // 'ended' is the real signal, the timer covers a browser that never fires it.
  var handedOver = false;
  function handOver() {
    if (handedOver) return;
    handedOver = true;
    showCarousel();
  }
  if (VIDEO_UNIT && vid) {
    vid.addEventListener('ended', handOver);
    setTimeout(function () { if (!vid.paused || vid.currentTime >= 15000 / 1000 - 0.3) handOver(); },
               15000 + 400);
  }

  if (isVideo && vid) {
    hideCarouselChrome();
    var started = false, refused = false;
    vid.addEventListener('playing', function () { started = true; }, { once: true });
    function attempt() {
      var p = vid.play();
      if (p && p.catch) p.catch(function (e) {
        // A genuine refusal is NotAllowedError. Anything else - AbortError, or
        // play() interrupted while the data is still arriving - is not.
        if (e && e.name === 'NotAllowedError') refused = true;
      });
    }
    attempt();
    // Only hand over to the carousel if the video genuinely will not run.
    // `vid.paused` cannot tell a refusal from a video that is merely still
    // buffering, so waiting on it handed perfectly good units to the carousel:
    // the review page loads six videos at once, and on a cold cache several are
    // still buffering well past three seconds. Wait on the play() promise
    // instead, and keep retrying as data arrives.
    ['loadeddata', 'canplay'].forEach(function (ev) {
      vid.addEventListener(ev, function () { if (!started) attempt(); });
    });
    var tries = 0;
    var poll = setInterval(function () {
      if (started) { clearInterval(poll); return; }
      if (refused || ++tries > 60) { clearInterval(poll); showCarousel(); return; }
      attempt();
    }, 500);
  } else {
    if (swipe && ('ontouchstart' in window)) {
      swipe.style.display = 'block';
      setTimeout(function () { if (!manual && swipe) swipe.style.display = 'none'; }, 6000);
    }
    restart();
  }

  // Review hook - used by the preview page, inert in a live placement.
  window.__ad = {
    loop: 7500, slides: n,
    setTime: function (ms) {
      if (isVideo && vid) { try { vid.currentTime = (ms / 1000) % (vid.duration || 15); } catch (e) {} }
      else { go(Math.floor((ms % this.loop) / (this.loop / n))); }
    },
    pause: function () { clearInterval(timer); if (vid) vid.pause(); },
    restart: function () {
      var root = document.getElementById('ad');
      root.classList.add('noanim'); void root.offsetWidth; root.classList.remove('noanim');
      // A replay puts the walkthrough back in the space, even if the carousel
      // had already taken over at the end of the previous run.
      if (VIDEO_UNIT && vid) {
        handedOver = false; clearInterval(timer);
        isVideo = true; vid.style.display = ''; hideCarouselChrome();
        try { vid.currentTime = 0; } catch (e) {}
        var p = vid.play(); if (p && p.catch) p.catch(function () {});
      } else if (vid) { try { vid.currentTime = 0; } catch (e) {} }
      i = 0; go(0);
    },
    play: function () { if (isVideo && vid) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } else { restart(); } },
    // Review hook. A browser that refuses autoplay gets the carousel, which is
    // correct in a placement but useless when the point is to watch the video.
    // The review page calls this from a real click, which always lifts the
    // refusal, and puts the video back if the fallback had already taken over.
    forcePlay: function () {
      if (!vid) return false;
      clearInterval(timer);
      handedOver = false;
      isVideo = true;
      vid.style.display = '';
      hideCarouselChrome();
      var p = vid.play(); if (p && p.catch) p.catch(function () {});
      return true;
    }
  };
})();
